services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bf_bootstrap
      POSTGRES_PASSWORD: ${BF_BOOTSTRAP_PASSWORD:?Set BF_BOOTSTRAP_PASSWORD in .env}
      POSTGRES_DB: postgres
      BF_MIGRATOR_PASSWORD: ${BF_MIGRATOR_PASSWORD:?Set BF_MIGRATOR_PASSWORD in .env}
      BF_RUNTIME_PASSWORD: ${BF_RUNTIME_PASSWORD:?Set BF_RUNTIME_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bf_bootstrap -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://bf_runtime:${BF_RUNTIME_PASSWORD}@db:5432/businessflow
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-300}
      REFRESH_SESSION_DAYS: ${REFRESH_SESSION_DAYS:-30}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_IP_FAILURE_LIMIT: ${LOGIN_IP_FAILURE_LIMIT:-20}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backend]

  migrate:
    build:
      context: .
      target: runtime
    profiles: [tools]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://bf_migrator:${BF_MIGRATOR_PASSWORD}@db:5432/businessflow
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  tests:
    build:
      context: .
      target: development
    profiles: [test]
    environment:
      APP_ENV: test
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://bf_runtime:${BF_RUNTIME_PASSWORD}@db:5432/businessflow_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://bf_migrator:${BF_MIGRATOR_PASSWORD}@db:5432/businessflow_test
      TEST_DATABASE_URL: postgresql+psycopg://bf_runtime:${BF_RUNTIME_PASSWORD}@db:5432/businessflow_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://bf_migrator:${BF_MIGRATOR_PASSWORD}@db:5432/businessflow_test
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://bf_bootstrap:${BF_BOOTSTRAP_PASSWORD}@db:5432/businessflow_test
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      ACCESS_TOKEN_TTL_SECONDS: 300
      REFRESH_SESSION_DAYS: 30
      LOGIN_FAILURE_LIMIT: 5
      LOGIN_IP_FAILURE_LIMIT: 20
      LOGIN_LOCKOUT_MINUTES: 15
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
